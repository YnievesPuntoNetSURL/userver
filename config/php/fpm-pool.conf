[global]
error_log = /var/log/php-fpm/error_log

[www]
listen = /run/php-fpm.sock
listen.owner = app
listen.group = app
listen.mode = 0660
pm.status_path = /fpm-status
pm = ondemand
; Valores optimizados para e-commerce Laravel
; pm.max_children: Máximo de procesos hijos (ajustar según RAM disponible)
; Cada proceso consume ~50-100MB. Ej: 50 procesos × 100MB = 5GB RAM
pm.max_children = ${PHP_FPM_MAX_CHILDREN:-75}
pm.process_idle_timeout = 10s
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /fpm-ping
user = app
group = app
