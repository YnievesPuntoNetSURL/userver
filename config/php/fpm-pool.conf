[global]
error_log = /var/log/php-fpm/error_log

[www]
listen = /run/php-fpm.sock
listen.owner = app
listen.group = app
listen.mode = 0660
pm.status_path = /fpm-status
pm = dynamic
; Valores optimizados para e-commerce Laravel
; pm.max_children: Máximo de procesos hijos (fijo en 50 para estabilidad)
; Cada proceso consume ~50-100MB. Ej: 50 procesos × 100MB = 5GB RAM máximo
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.process_idle_timeout = 10s
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /fpm-ping
user = app
group = app
